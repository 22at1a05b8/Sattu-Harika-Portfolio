<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gallery | Harika</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<style>

/* Gallery Page */
.gallery-container{
 padding:120px 8%;
}

.gallery-title{
 font-size:2.5rem;
 margin-bottom:20px;
}

.gallery-sub{
 color:#cfcfff;
 margin-bottom:40px;
}

/* Masonry Layout */
.masonry{
 column-count:3;
 column-gap:20px;
}

.masonry img{
 width:100%;
 margin-bottom:20px;
 border-radius:15px;
 cursor:pointer;
 transition:.4s;
}

.masonry img:hover{
 transform:scale(1.05);
 box-shadow:0 0 30px rgba(124,124,255,.5);
}

/* Lightbox */
.lightbox{
 position:fixed;
 top:0;left:0;
 width:100%;height:100%;
 background:rgba(0,0,0,.8);
 display:none;
 align-items:center;
 justify-content:center;
 z-index:9999;
 backdrop-filter:blur(10px);
}

.lightbox img{
 max-width:90%;
 max-height:90%;
 border-radius:15px;
 box-shadow:0 0 50px rgba(124,124,255,.7);
 animation:zoom .3s ease;
}

@keyframes zoom{
 from{transform:scale(.7);opacity:0}
 to{transform:scale(1);opacity:1}
}

.close{
 position:absolute;
 top:30px;
 right:40px;
 font-size:40px;
 color:white;
 cursor:pointer;
}

@media(max-width:900px){
 .masonry{column-count:2;}
}

@media(max-width:500px){
 .masonry{column-count:1;}
}

</style>
</head>

<body>



<section class="gallery-container">
  <h1 class="gallery-title">My Inspirations & Interests</h1>
  <p class="gallery-sub">Technology • AI • Creativity • Learning • Growth</p>

  <div class="masonry">
<img src="images/img1.jpg" onclick="openLightbox(this.src)">
<img src="images/img2.jpg" onclick="openLightbox(this.src)">
<img src="images/img3.jpg" onclick="openLightbox(this.src)">
<img src="images/img4.jpg" onclick="openLightbox(this.src)">
<img src="images/img5.jpg" onclick="openLightbox(this.src)">
<img src="images/img6.jpg" onclick="openLightbox(this.src)">
  </div>
</section>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">×</span>
  <img id="lightbox-img">
</div>

<script>
function openLightbox(src){
 document.getElementById('lightbox').style.display='flex';
 document.getElementById('lightbox-img').src = src;
}

function closeLightbox(){
 document.getElementById('lightbox').style.display='none';
}

// ESC key close
document.addEventListener('keydown', function(e){
 if(e.key === "Escape"){
   closeLightbox();
 }
});
</script>

</body>
</html>
